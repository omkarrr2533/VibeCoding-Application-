name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: omjewellers_test
          POSTGRES_USER: omuser
          POSTGRES_PASSWORD: ompass
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate --no-input
        env: { DATABASE_URL: "postgres://omuser:ompass@localhost:5432/omjewellers_test" }
      - run: pytest -v
        working-directory: backend
        env: { DATABASE_URL: "postgres://omuser:ompass@localhost:5432/omjewellers_test" }
      - run: python backend/manage.py seed_omjewellers
        env: { DATABASE_URL: "postgres://omuser:ompass@localhost:5432/omjewellers_test" }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test --if-present
        working-directory: frontend
